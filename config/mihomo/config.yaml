# mihomo 配置：TUN 透明代理 + 国内外分流 + 虚拟组网直连
#
# 上游出口是虚拟组网另一侧的 HTTP 代理（192.168.100.254:7890）。该网段
# 不在本机物理局域网内，只经 easytier 隧道可达 —— modules/easytier.nix 已把
# easytier 隔离到独立 netns，宿主侧 veth 走本机 proxy_network 导出的段
# （192.168.10.0/24），并配了指向该 netns 的静态路由。
# 因此 mihomo 不能用 auto-detect-interface（它只认接口地址前缀，不读路由表，
# 而通道 veth 的前缀不覆盖 192.168.100.254，会回落到物理网卡），改用
# routing-mark：出站 socket 不绑网卡，由静态路由决定经组网出去。
# 本机不持有任何订阅链接或节点密钥，因此这个文件可以安全入库。
# 由 modules/mihomo.nix 通过 systemd LoadCredential 注入，不落到 /etc。

# 出站流量打 SO_MARK，配合 modules/easytier.nix 里的
# `ip rule pref 8999 fwmark 6666 lookup main` 放行，使其绕开本TUN 的
# 路由表、按静态路由经组网 veth 出去。关掉 auto-detect-interface 是
# 前提：它会强制把出站绑到某张网卡，与上面的路由方式冲突。
routing-mark: 6666

# ---------- 基础 ----------
mixed-port: 7890
# 只监听本机：TUN 模式下没有给局域网做代理的必要
allow-lan: false
bind-address: 127.0.0.1
mode: rule
log-level: info
ipv6: false

unified-delay: true
tcp-concurrent: true
# 不做进程匹配：systemd 沙箱里没给 CAP_SYS_PTRACE，保持最小权限
find-process-mode: "off"

# 本地 Web UI（metacubexd），仅 127.0.0.1 可访问
external-controller: 127.0.0.1:9090

# ---------- GEO 数据 ----------
geodata-mode: true
geo-auto-update: true
geo-update-interval: 24
# 默认下载地址在 GitHub，本机直连超时，改用 jsDelivr 镜像
geox-url:
  geoip: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"
  geosite: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  mmdb: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb"

# ---------- TUN ----------
tun:
  enable: true
  stack: mixed
  device: mihomo
  auto-route: true
  auto-redirect: true
  # 出站网卡交给内核路由表决定（配合上面的 routing-mark），
  # 不启用 auto-detect-interface —— 它只按接口地址前缀选卡，不读路由表。
  auto-detect-interface: false
  # 劫持 DNS 查询，由 mihomo 内置 DNS 直接应答，
  # 因此不需要 listen（绑定 53 需要 root，服务是 DynamicUser）
  dns-hijack:
    - any:53
  # 与 netns 内 easytier0（MTU 1380）共存，取略小的值避免隧道叠加后分片
  mtu: 1400

  # 排除宿主侧的组网 veth。
  #
  # auto-redirect 的 nftables 规则挂在 output/prerouting 链上，会连带劫持
  # netns 经该 veth 转发出来的流量 —— easytier 的出站隧道连接因此被 mihomo
  # 截走，组网断掉、上游代理不可达，形成"mihomo 依赖 easytier、easytier 又
  # 被 mihomo 阻塞"的循环。排除后组网流量直走 veth。
  #
  # 接口名须与 modules/easytier.nix 的 vethHost 一致：kuangshi 用 veasy0，
  # vivobook 用同一名称。若改了一处，另一处也要同步。
  exclude-interface:
    - veasy0

# ---------- DNS ----------
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "*.localdomain"
    - "*.arpa"
    - "+.in-addr.arpa"
    - "+.ip6.arpa"
    - "localhost.ptlogin2.qq.com"
    - "+.srv.nintendo.net"
    - "+.stun.playstation.net"
    - "+.xboxlive.com"
    - "time.*.com"
    - "+.pool.ntp.org"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    # 虚拟组网 / 内网域名不走 fake-ip，避免与 easytier 冲突
    - "+.225284.xyz"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  # 直连域名用国内 DoH，被代理域名用国外 DoH（走上游代理）
  nameserver-policy:
    "geosite:private,cn":
      - https://223.5.5.5/dns-query
      - https://doh.pub/dns-query
    "geosite:geolocation-!cn":
      - https://1.1.1.1/dns-query#PROXY
      - https://dns.google/dns-query#PROXY
  nameserver:
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query
  # 解析上游代理自身域名时不能依赖代理，否则死锁
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query

# ---------- 出站 ----------
proxies:
  - name: 上游代理
    type: http
    server: 192.168.100.254
    port: 7890

proxy-groups:
  - name: PROXY
    type: select
    proxies:
      - 上游代理
      - DIRECT
  # Cachix（二进制缓存）。实测从本网络经上游代理访问
  # *.cachix.org 会在 TLS ClientHello 之后被 reset（curl 000、nix 报
  # SSL connect error 35），间歇性成功，nix 会因此直接放弃 substituter
  # 查询并让构建失败。是否直连有效取决于当时的上游线路，所以做成
  # select：在 Web UI 里按域名现场切换，不必改配置重连。
  - name: CACHIX
    type: select
    proxies:
      - 上游代理
      - DIRECT
  # opencode.ai 同理：单独一个选择组，与 cachix 互不影响。
  - name: OPENCODE
    type: select
    proxies:
      - 上游代理
      - DIRECT

# ---------- 规则 ----------
# 顺序即优先级：内网/组网直连 → 国内直连 → 其余走代理
rules:
  # 上游代理所在网段。客户端访问该段应直连（由宿主 veth → easytier 送出）；
  # mihomo 自己拨上游代理的连接不进 TUN，不受此规则影响。
  - IP-CIDR,192.168.100.0/24,DIRECT,no-resolve
  # easyTier 虚拟组网（10.126.126.0/24）及其导出的子网 192.168.10.0/24
  - IP-CIDR,10.126.126.0/24,DIRECT,no-resolve
  - IP-CIDR,192.168.10.0/24,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR6,::1/128,DIRECT,no-resolve
  - IP-CIDR6,fc00::/7,DIRECT,no-resolve
  - IP-CIDR,224.0.0.0/4,DIRECT,no-resolve
  - IP-CIDR,240.0.0.0/4,DIRECT,no-resolve
  - GEOSITE,private,DIRECT
  # 国内 nix 镜像显式直连。mirror.sjtu.edu.cn 目前本来就命中
  # GeoSite/cn 走直连，但那是 geosite 数据库决定的，数据库一更新就可能
  # 漂移；显式声明把这条链路钉死，不受 geo 数据变动影响。
  - DOMAIN-SUFFIX,sjtu.edu.cn,DIRECT
  # 下面两组走各自的 select 组，可在 Web UI（127.0.0.1:9090）里切换
  # 走代理还是直连。注意只切换"出站"，DNS 仍由
  # nameserver-policy 的 geolocation-!cn 分支经代理 DoH 解析。
  - DOMAIN-SUFFIX,cachix.org,CACHIX
  - DOMAIN-SUFFIX,opencode.ai,OPENCODE
  # 国内直连
  - GEOSITE,cn,DIRECT
  - GEOIP,CN,DIRECT,no-resolve
  # 其余（github 等）走上游代理
  - MATCH,PROXY